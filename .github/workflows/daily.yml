name: nightly

on:
  schedule:
    - cron: "0 11 * * *"      # 11:00 UTC daily
  workflow_dispatch:            # manual run button

permissions:
  contents: write              # allow the job to push commits

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install -r requirements.txt

      - name: run nightly update
        run: python pipeline/update.py

      - name: commit + push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/raw_2026.parquet
          git diff --cached --quiet || git commit -m "nightly $(date +%F)"
          git push
